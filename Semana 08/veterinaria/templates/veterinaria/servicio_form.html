{% extends 'veterinaria/base.html' %}
{% block title %}{% if servicio %}Editar servicio{% else %}Nuevo servicio{% endif %}{% endblock %}
{% block content %}
<div class="card shadow-sm border-0 rounded-3 col-md-6 mx-auto"><div class="card-body p-4"><h1 class="h3 mb-4">{% if servicio %}Editar servicio{% else %}Nuevo servicio{% endif %}</h1><form method="post">{% csrf_token %}{{ form.as_p }}<div class="d-flex gap-2"><button class="btn btn-success rounded-pill px-3" type="submit"><i class="bi bi-check-lg me-1"></i>Guardar</button><a class="btn btn-outline-secondary" href="{% url 'lista_servicios' %}"><i class="bi bi-x-lg me-1"></i>Cancelar</a></div></form></div></div>
{% endblock %}
