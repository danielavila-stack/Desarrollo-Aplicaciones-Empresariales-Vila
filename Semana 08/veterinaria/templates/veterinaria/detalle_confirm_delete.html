{% extends 'veterinaria/base.html' %}
{% block title %}Eliminar detalle{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7"><div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h3 mb-3">Eliminar detalle de receta</h1>
    <p>¿Deseas eliminar el detalle de <strong>{{ detalle.insumo.nombre }}</strong> de la cita #{{ detalle.cita.id }}?</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button class="btn btn-danger" type="submit">Sí, eliminar</button>
            <a class="btn btn-outline-secondary" href="{% url 'lista_detalles' %}">Cancelar</a>
        </div>
    </form>
</div></div></div></div>
{% endblock %}
