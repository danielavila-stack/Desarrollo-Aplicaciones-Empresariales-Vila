<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}D’VIDA & MENTE{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root {
        --primary: #4f46e5;
        --primary-soft: #eef2ff;
        --accent: #14b8a6;
        --warning: #fbbf24;
        --danger: #ef4444;
        --text: #1f2937;
        --muted: #6b7280;
        --surface: #ffffff;
      }

      body {
        background: linear-gradient(180deg, #f8fafc 0%, #eef7ff 100%);
        color: var(--text);
        font-family: 'Segoe UI', sans-serif;
      }

      .navbar {
        background: linear-gradient(90deg, #1f2a44 0%, #2d5d8a 100%);
        box-shadow: 0 10px 30px rgba(31, 42, 68, 0.15);
      }

      .navbar-brand {
        letter-spacing: 0.04em;
      }

      .hero {
        background: linear-gradient(135deg, rgba(79, 70, 229, 0.12), rgba(20, 184, 166, 0.08));
        border: 1px solid rgba(79, 70, 229, 0.08);
        border-radius: 22px;
      }

      .stat-card {
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06);
      }

      .card {
        border: none;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      .badge {
        font-size: 0.8rem;
        padding: 0.55em 0.8em;
      }

      .btn-primary {
        background: linear-gradient(135deg, #4f46e5, #3b82f6);
        border: none;
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, #4338ca, #2563eb);
      }

      .soft-title {
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">D’VIDA & MENTE</a>
        <div class="d-flex gap-3">
          <a class="nav-link text-white-50" href="{% url 'inicio' %}">Inicio</a>
          <a class="nav-link text-white-50" href="{% url 'lista_citas' %}">Agenda</a>
          <a class="btn btn-light btn-sm" href="{% url 'crear_cita' %}">Nueva cita</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'success' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}

      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
