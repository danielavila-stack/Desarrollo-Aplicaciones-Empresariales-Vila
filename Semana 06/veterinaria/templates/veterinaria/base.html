<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gestion veterinaria{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'lista_mascotas' %}"><i class="bi bi-heart-pulse me-1"></i>Pet Care</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarVeterinaria" aria-controls="navbarVeterinaria" aria-expanded="false" aria-label="Abrir navegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarVeterinaria">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{% url 'lista_especies' %}"><i class="bi bi-diagram-3 me-1"></i>Especies</a>
                    <a class="nav-link" href="{% url 'lista_insumos' %}"><i class="bi bi-box-seam me-1"></i>Insumos</a>
                    <a class="nav-link" href="{% url 'lista_servicios' %}"><i class="bi bi-clipboard2-pulse me-1"></i>Servicios</a>
                    <a class="nav-link" href="{% url 'lista_mascotas' %}"><i class="bi bi-heart me-1"></i>Mascotas</a>
                    <a class="nav-link" href="{% url 'lista_historiales' %}"><i class="bi bi-journal-medical me-1"></i>Historial médico</a>
                    <a class="nav-link" href="{% url 'cita_list' %}"><i class="bi bi-calendar2-check me-1"></i>Citas Médicas</a>
                    <a class="nav-link" href="{% url 'lista_detalles' %}"><i class="bi bi-prescription2 me-1"></i>Recetas Médicas</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'success' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
