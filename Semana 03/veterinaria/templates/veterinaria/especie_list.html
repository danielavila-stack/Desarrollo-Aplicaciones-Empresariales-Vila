{% extends 'veterinaria/base.html' %}
{% block title %}Especies{% endblock %}
{% block content %}<div class="page-header d-flex flex-wrap align-items-end justify-content-between gap-3"><div><p class="text-uppercase text-secondary small fw-bold mb-2">Catalogo</p><h1 class="h2">Especies</h1></div><a class="btn btn-primary" href="{% url 'veterinaria:especie_create' %}"><i class="bi bi-plus-lg me-1"></i>Nueva especie</a></div><div class="surface p-3 mb-4"><form method="get" class="row g-2"><div class="col-md-10"><input class="form-control" name="q" value="{{ query }}" placeholder="Buscar especie"></div><div class="col-md-2 d-grid"><button class="btn btn-outline-secondary" type="submit">Buscar</button></div></form></div><div class="surface overflow-hidden"><table class="table table-hover mb-0"><thead><tr><th>Nombre</th><th class="text-end">Acciones</th></tr></thead><tbody>{% for especie in especies %}<tr><td>{{ especie.nombre }}</td><td class="text-end"><a class="btn btn-sm btn-outline-primary" href="{% url 'veterinaria:especie_update' especie.pk %}">Editar</a> <form class="d-inline" method="post" action="{% url 'veterinaria:especie_delete' especie.pk %}" onsubmit="return confirm('Deseas eliminar esta especie?');">{% csrf_token %}<button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash me-1"></i>Eliminar</button></form></td></tr>{% empty %}<tr><td colspan="2" class="empty-state">No hay especies registradas.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
