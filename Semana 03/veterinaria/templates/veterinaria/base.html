{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PetCare{% endblock %} | Centro Veterinario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --petcare-ink: #17324d; --petcare-teal: #0f8b8d; --petcare-bg: #f3f8f7; }
        body { background: var(--petcare-bg); color: var(--petcare-ink); }
        .navbar { background: var(--petcare-ink); }
        .brand-mark { color: #fff; font-weight: 800; letter-spacing: .04em; }
        .brand-mark span { color: #6ed4bf; }
        .nav-link { color: #c9d9e5; }
        .nav-link:hover, .nav-link.active { color: #fff; }
        .page-header { padding: 2.25rem 0 1.5rem; }
        .surface { background: #fff; border: 1px solid #dce9e6; border-radius: .75rem; box-shadow: 0 .5rem 1.5rem rgba(23, 50, 77, .06); }
        .table thead th { background: #edf6f4; color: #507079; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
        .table td, .table th { vertical-align: middle; }
        .btn-primary { background: var(--petcare-teal); border-color: var(--petcare-teal); }
        .btn-primary:hover { background: #0b7072; border-color: #0b7072; }
        .form-control:focus, .form-select:focus { border-color: #6ed4bf; box-shadow: 0 0 0 .2rem rgba(15, 139, 141, .15); }
        .empty-state { color: #708891; padding: 3rem 1rem; text-align: center; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand brand-mark" href="{% url 'veterinaria:mascota_list' %}"><i class="bi bi-heart-pulse-fill me-2"></i>Pet<span>Care</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Mostrar navegacion"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="mainNav">
            <div class="navbar-nav ms-auto gap-lg-2">
                <a class="nav-link" href="{% url 'veterinaria:mascota_list' %}"><i class="bi bi-heart me-1"></i>Mascotas</a>
                <a class="nav-link" href="{% url 'veterinaria:historial_list' %}"><i class="bi bi-clipboard2-pulse me-1"></i>Historiales</a>
                <a class="nav-link" href="{% url 'veterinaria:especie_list' %}"><i class="bi bi-diagram-3 me-1"></i>Especies</a>
                <a class="nav-link" href="{% url 'veterinaria:insumo_list' %}"><i class="bi bi-box-seam me-1"></i>Insumos</a>
                <a class="nav-link" href="{% url 'veterinaria:servicio_list' %}"><i class="bi bi-bandaid me-1"></i>Servicios</a>
            </div>
        </div>
    </div>
</nav>
<main class="container pb-5">
    {% if messages %}
        {% for message in messages %}<div class="alert alert-{{ message.tags|default:'success' }} alert-dismissible fade show mt-4" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button></div>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
